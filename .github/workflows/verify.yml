name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python3 -m compileall -q .

      - name: Check skill entrypoints
        run: |
          test -f xhs-pipeline-lingyi/SKILL.md
          test -f xhs-pipeline-lingyi/README.md
          test -f wechat-mp-publisher/SKILL.md
          test -f wechat-mp-publisher/README.md

      - name: Check whitespace
        run: git diff --check
